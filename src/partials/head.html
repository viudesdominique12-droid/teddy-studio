<script>document.documentElement.classList.add('js');</script>
<script>
  /* UN SEUL THÈME : le Vert d'origine (Dominique, 18/10/2026 : « on reste que
     sur le vert de base, enlève les options »). Les thèmes d'essai Nuit et
     Papier sont retirés ; on oublie le choix d'un visiteur qui les essayait. */
  try { localStorage.removeItem('teddy:palette'); } catch (e) {}
</script>
<script>
  /* LE VOLET, DÈS LE PREMIER AFFICHAGE (27/09/2026). Chaque page s'ouvre par
     le chevron qui la découvre (`wipe.js`), mais il ne se posait qu'une fois
     le JavaScript chargé : la page apparaissait d'abord un instant, nue, puis
     se couvrait, puis se découvrait — « comme si le site se réinitialisait ».
     La page naît donc couverte (`is-wiping`, le volet fermé en CSS) ; le vrai
     volet prend le relais au même endroit. Sans JavaScript, rien n'est
     couvert ; si le script ne vient pas, le filet découvre la page.
     SEULEMENT APRÈS LE VOLET (F03, 18/10/2026) : une arrivée directe (Google,
     WhatsApp, une adresse tapée) n'a pas de volet qui se ferme avant elle ; la
     couvrir faisait attendre une page déjà prête. `wipe.js` laisse une marque
     au moment de naviguer ; seule une page qui la trouve, fraîche, naît
     couverte. */
  (function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var t = null;
    try { t = sessionStorage.getItem('teddy-wipe'); sessionStorage.removeItem('teddy-wipe'); } catch (e) {}
    var age = t ? Date.now() - Number(t) : NaN;
    if (!(age >= 0 && age < 8000)) return;
    var h = document.documentElement;
    h.classList.add('is-wiping');
    setTimeout(function () { h.classList.remove('is-wiping'); }, 2500);
  })();
</script>
