# Construit le site et le publie sur GitHub Pages.
#
# Depuis le 02/11/2026, le site est servi à la racine de son domaine,
# tedystudios.com : `SITE_BASE` vaut donc `/`. `rebase.mjs` ne déplace plus
# aucun chemin, il rend seulement `og:image` absolue sur ce domaine.
# (Pour revenir au sous-dossier GitHub Pages : SITE_BASE `/<dépôt>/`.)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE_BASE: /
        run: npm run build
      - name: og:image absolue sur le domaine
        run: node scripts/rebase.mjs / dist "https://tedystudios.com"
      # Pages ne sert pas de fichier commençant par un souligné, et Jekyll
      # s'active par défaut : ce marqueur le désactive.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
